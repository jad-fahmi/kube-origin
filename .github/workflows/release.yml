name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          binary="kube-origin-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then binary="${binary}.exe"; fi
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${binary}" ./cmd/kube-origin
      - uses: actions/upload-artifact@v4
        with:
          name: kube-origin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kube-origin-*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kube-origin-*
          path: dist
          merge-multiple: true
      - name: Create checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          cd dist
          sha256sum kube-origin-* | sort -k2 > checksums.txt
          gh --repo "$REPOSITORY" release create "$VERSION" ./* --verify-tag --generate-notes
