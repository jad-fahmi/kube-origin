apiVersion: v1
kind: Config
current-context: development
contexts:
  - name: development
    context:
      cluster: shared-cluster
      user: developer
      namespace: payments
clusters:
  - name: shared-cluster
    cluster:
      server: https://api.example.invalid:6443
users:
  - name: developer
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: cloud-login
        args:
          - --environment
          - development
